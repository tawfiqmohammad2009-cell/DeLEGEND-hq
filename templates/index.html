<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeLEGEND AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Load Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Load Marked.js to format Markdown responses -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="chat-header">
            <div class="brand-info">
                <h1>DeLEGEND AI</h1>
                <span class="status-badge"><span class="status-dot"></span> Powered by Gemini</span>
            </div>
            <button class="clear-btn" onclick="clearChat()">Clear Chat</button>
        </header>
        
        <!-- Chat Area -->
        <main class="chat-box" id="chat-box">
            <div class="message bot-message">
                <div class="message-sender">DeLEGEND AI</div>
                <div class="message-content">Hello! I am online and ready. What would you like to build or discuss?</div>
            </div>
        </main>

        <!-- Input Area -->
        <footer class="input-container">
            <input type="text" id="user-input" placeholder="Type your message here..." onkeypress="handleKeyPress(event)" autocomplete="off">
            <button id="send-btn" onclick="sendMessage()">Send</button>
        </footer>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const messageText = inputField.value.trim();

            if (!messageText) return;

            // Display user message
            const userDiv = document.createElement("div");
            userDiv.className = "message user-message";
            userDiv.innerHTML = `
                <div class="message-sender">You</div>
                <div class="message-content">${escapeHtml(messageText)}</div>
            `;
            chatBox.appendChild(userDiv);

            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Display loading indicator
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message bot-message loading-state";
            loadingDiv.innerHTML = `
                <div class="message-sender">DeLEGEND AI</div>
                <div class="message-content"><em>Thinking...</em></div>
            `;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: messageText })
                });

                const data = await response.json();
                
                if (data.reply) {
                    loadingDiv.classList.remove("loading-state");
                    loadingDiv.innerHTML = `
                        <div class="message-sender">DeLEGEND AI</div>
                        <div class="message-content">${marked.parse(data.reply)}</div>
                    `;
                } else {
                    loadingDiv.innerHTML = `
                        <div class="message-sender">System Error</div>
                        <div class="message-content error-text">${data.error || "Failed to get response"}</div>
                    `;
                }
            } catch (err) {
                loadingDiv.innerHTML = `
                    <div class="message-sender">System Error</div>
                    <div class="message-content error-text">Network error. Please try again.</div>
                `;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function clearChat() {
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML = `
                <div class="message bot-message">
                    <div class="message-sender">DeLEGEND AI</div>
                    <div class="message-content">Chat cleared. How can I help you?</div>
                </div>
            `;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
