<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeLEGEND AI-Forge</title>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: #f8fafc; padding: 2rem; text-align: center; }
        .card { background: #1e293b; padding: 2rem; border-radius: 12px; max-width: 400px; margin: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input { padding: 0.5rem; width: 80%; margin-bottom: 1rem; border-radius: 4px; border: none; }
        button { background: #3b82f6; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; }
        button:hover { background: #2563eb; }
        #result { margin-top: 1rem; font-weight: bold; color: #38bdf8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>DeLEGEND AI-Forge</h2>
        <p>Extreme Web Automation & Licensing</p>
        <input type="text" id="textInput" placeholder="Enter text (e.g. DeLEGEND)">
        <br>
        <button onclick="generate()">Generate Graphic</button>
        <div id="result"></div>
    </div>
    <script>
        async function generate() {
            const text = document.getElementById('textInput').value;
            const response = await fetch('/api/generate-graphic', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: text })
            });
            const data = await response.json();
            document.getElementById('result').innerText = data.message;
        }
    </script>
</body>
</html>
