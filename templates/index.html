<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeLEGEND AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Load Marked.js to format Markdown responses -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h2>DeLEGEND AI</h2>
            <p>Powered by Google Gemini</p>
        </div>
        
        <div class="chat-box" id="chat-box">
            <div class="message bot-message">
                <strong>Gemini:</strong> Hello! I am online and ready. What would you like to build or discuss?
            </div>
        </div>

        <div class="input-container">
            <input type="text" id="user-input" placeholder="Type your message..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const inputField = document.getElementById("user-input");
            const chatBox = document.getElementById("chat-box");
            const messageText = inputField.value.trim();

            if (!messageText) return;

            // Display user message
            const userDiv = document.createElement("div");
            userDiv.className = "message user-message";
            userDiv.innerHTML = `<strong>You:</strong> ${escapeHtml(messageText)}`;
            chatBox.appendChild(userDiv);

            inputField.value = "";
            chatBox.scrollTop = chatBox.scrollHeight;

            // Display loading state
            const loadingDiv = document.createElement("div");
            loadingDiv.className = "message bot-message";
            loadingDiv.innerHTML = `<strong>Gemini:</strong> <em>Thinking...</em>`;
            chatBox.appendChild(loadingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch("/chat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ message: messageText })
                });

                const data = await response.json();
                
                if (data.reply) {
                    // Render formatted Markdown response
                    loadingDiv.innerHTML = `<strong>Gemini:</strong><br>${marked.parse(data.reply)}`;
                } else {
                    loadingDiv.innerHTML = `<strong>Error:</strong> ${data.error || "Failed to get response"}`;
                }
            } catch (err) {
                loadingDiv.innerHTML = `<strong>Error:</strong> Network error. Please try again.`;
            }

            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === "Enter") {
                sendMessage();
            }
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
